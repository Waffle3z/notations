<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta http-equiv='cache-control' content='no-cache'>
	<meta http-equiv='expires' content='0'>
	<meta http-equiv='pragma' content='no-cache'>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Compare notations</title>
	<link rel="stylesheet" type="text/css" href="../styles.css">
	<style>
		table { border-collapse: collapse; margin-bottom: 40px; }
		th { position: sticky; top: 0; background: #333; text-align: left; vertical-align: top; font-weight: normal; }
		th, td { border: 1px solid #444; padding: 3px 6px; }
		td.cell { font-family: Consolas, monospace; overflow-wrap: anywhere; cursor: pointer; max-width: 40vw; }
		td.cell:hover { background: #333; }
		td.out { color: #666; cursor: default; }
		.title { white-space: nowrap; }
		.small { background: #474747; color: #ccc; border: none; border-radius: 6px; cursor: pointer; margin-left: 2px; width: 20px; height: 20px; padding: 0; font-size: 13px; line-height: 20px; vertical-align: middle; }
		.settings { font-size: 13px; padding-top: 4px; }
		.settings label { display: block; white-space: nowrap; }
		select { background: #474747; color: #ccc; border: none; }
	</style>
</head>
<body>
	<h2>Compare notations</h2>
	<div>Click a cell to add the next element of that column's fundamental sequence below it; shift-click to keep expanding.</div>
	<br>
	<table id="table"></table>
	<div id="footer"><a href="..">Index</a></div>

	<script src="../ordinals/bocf.js"></script>
	<script src="../ordinals/veblen.js"></script>
	<script src="../ordinals/nocf.js"></script>
	<script src="compare.js"></script>
</body>
</html>
