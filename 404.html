<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta http-equiv='cache-control' content='no-cache'> 
	<meta http-equiv='expires' content='0'> 
	<meta http-equiv='pragma' content='no-cache'>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="../styles.css">
</head>
<body>
	<script>
		(function() {
			let segments = window.location.pathname.split('/').filter(Boolean);
			let params = new URLSearchParams(window.location.search);
			let notationDir = decodeURIComponent(segments[segments.length - 1] || 'worm');
			let encodedNotation = encodeURIComponent(notationDir);	
			let prefix = '/' + segments.slice(0, -1).join("/") + (segments.length > 1 ? '/' : '');
			function addScript(src) {
				return new Promise((resolve, reject) => {
					let s = document.createElement('script');
					s.async = false;
					s.src = src;
					s.onload = resolve;
					s.onerror = reject;
					document.body.appendChild(s);
				});
			}

			// main.js waits for this to call initialize once the notation is loaded
			window.deferInit = true;
			(async function() {
				let src = prefix + encodedNotation + '/notation.js';
				let response = await fetch(src).catch(() => null);
				let text = response && response.ok ? await response.text() : null;
				// a notation lists the shared scripts it uses on a line "// requires: ordinals/bocf.js ..."
				let match = text && text.match(/^\/\/ requires:(.*)$/m);
				let requires = match ? match[1].split(/\s+/).filter(Boolean) : [];
				await addScript(prefix + 'main.js');
				for (let dep of requires) await addScript(prefix + dep);
				if (text) {
					await addScript(src);
				} else {
					await addScript(prefix + 'worm/notation.js');
					notation.missing = true;
				}
				if (!document.getElementById('root')) initialize();
			})();
		})();
	</script>
</body>
</html>
